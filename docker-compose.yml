services:
  postgres:
    image: postgres:16-alpine
    container_name: omniagent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: omniagent
      POSTGRES_USER: omniagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omniagent_secret}
    volumes:
    - omniagent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U omniagent
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
  omniagent:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: omniagent:latest
    container_name: omniagent
    restart: unless-stopped
    cap_add:
    - SYS_ADMIN
    security_opt:
    - seccomp=unconfined
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
    - .env
    environment:
    - DATABASE_URL=postgresql+asyncpg://omniagent:${POSTGRES_PASSWORD:-omniagent_secret}@postgres:5432/omniagent
    - OLLAMA_BASE_URL=http://host.docker.internal:11434
    group_add:
    - '958'
    extra_hosts:
    - host.docker.internal:host-gateway
    ports:
    - 8181:8080
    volumes:
    - .:/app:ro
    - omniagent_venv:/app/.venv
    - omniagent_data:/app/data
    - omniagent_logs:/app/logs
    - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '2.0'
        reservations:
          memory: 256M
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import sys; sys.exit(0)
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
  omni-dashboard:
    build:
      context: ./omni-dashboard
      dockerfile: Dockerfile
    image: omni-dashboard:latest
    container_name: omni_dashboard
    restart: unless-stopped
    ports:
    - 3000:80
    depends_on:
    - omniagent
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
volumes:
  omniagent_pgdata:
    driver: local
  omniagent_venv:
    driver: local
  omniagent_data:
    driver: local
  omniagent_logs:
    driver: local
