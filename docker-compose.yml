# ============================================================
# Production docker-compose for OmniAgent v3
# ============================================================

services:
  omniagent:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: omniagent:latest
    container_name: omniagent
    restart: unless-stopped

    # Required for Puppeteer / Chromium to launch headlessly inside Docker
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined

    env_file:
      - .env

    environment:
      # Docker-in-Docker: override OLLAMA URL so container reaches host Ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434

    # Add the host's docker group (GID 958) so the container can access /var/run/docker.sock
    # Run: stat -c '%g' /var/run/docker.sock  to verify this matches your host
    group_add:
      - "958"

    # On Linux, host.docker.internal doesn't exist by default — add it.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # ─── Source code mount ───────────────────────────────────────────────────
      # Mount the project source read-only so code changes are instant —
      # Mount the project source read-only so code changes are instant —
      # no rebuild needed, just `docker compose restart`.
      - .:/app:ro
      # Keep the baked .venv writable (uv needs to write .lock files)
      # This anonymous volume sits on top of the ro mount for /app/.venv only.
      - omniagent_venv:/app/.venv
      # Persist SQLite DB across restarts (writable override of the ro mount)
      - omniagent_data:/app/data
      # Persist log files
      - omniagent_logs:/app/logs
      # ─── Docker socket for sandbox tool ─────────────────────────────────────
      - /var/run/docker.sock:/var/run/docker.sock

    # Resource limits (adjust for your homelab)
    # Note: sandbox containers have their own limits (256MB, 50% CPU each)
    deploy:
      resources:
        limits:
          memory: 768M       # Increased to account for sandbox management overhead
          cpus: '2.0'
        reservations:
          memory: 256M

    # Graceful shutdown timeout
    stop_grace_period: 30s

    # Logging configuration
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  omniagent_venv:
    driver: local
  omniagent_data:
    driver: local
  omniagent_logs:
    driver: local
