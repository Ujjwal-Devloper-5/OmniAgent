[project]
name = "omniagent"
version = "2.0.0"
description = "Production-grade multi-platform AI bot for Discord and Telegram, powered by Google Gemini and LangGraph"
readme = "README.md"
authors = [
    { name = "Ujjwal-Developer-5", email = "ujjwalkumarbgpg6@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [

    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Platform adapters
    "slack-bolt>=1.18.0",
    "aiohttp>=3.9.0",
    "discord-py[voice]>=2.7.1",
    "pynacl>=1.5.0",
    "davey>=0.1.0",
    "python-telegram-bot>=22.8",
    # AI core
    "langchain>=1.3.14",
    "langchain-google-genai>=4.3.2",
    "langchain-community>=0.3.0",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-sqlite>=3.1.1",
    # Tools
    "duckduckgo-search>=8.1.1",
    "wikipedia>=1.4.0",
    "httpx>=0.27.0",
    # Config & environment
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.2.2",
    # Database
    "aiosqlite>=0.21.0",
    "asyncpg>=0.29.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.1.0",
    "ddgs>=9.14.4",
    "langchain-openai>=1.4.1",
    "langchain-anthropic>=1.5.4",
    "langchain-ollama>=1.1.0",
    "langchain-groq>=1.1.3",
    # MCP (Model Context Protocol) — connect to external MCP servers
    "mcp>=1.0.0",
    "langchain-mcp-adapters>=0.1.0",
    "google-generativeai>=0.8.6",
]

[project.scripts]
omniagent = "main:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
