# Prometheus Configuration for OmniAgent Enterprise Observability Stack
# Requirement: Global scrape interval 15s, job_name 'omniagent', targets ['omniagent:8080'], metrics_path '/metrics'

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # ── OmniAgent Application Metrics Scraper ─────────────────────────────────
  - job_name: 'omniagent'
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['omniagent:8080']
        labels:
          app: 'omniagent'
          env: 'production'

  # ── Prometheus Internal Metrics Scraper ───────────────────────────────────
  - job_name: 'prometheus'
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ['localhost:9090']
        labels:
          app: 'prometheus'
          env: 'production'
