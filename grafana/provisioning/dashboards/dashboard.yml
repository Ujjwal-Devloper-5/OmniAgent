# Grafana Dashboard Provider Provisioning Configuration
# Requirement: Dashboard provider pointing to /var/lib/grafana/dashboards

apiVersion: 1

providers:
  - name: 'OmniAgent'
    orgId: 1
    folder: 'OmniAgent'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
