# Grafana Datasource Provisioning Configuration
# Requirement: Prometheus datasource pointing to url: http://prometheus:9090, access: proxy, isDefault: true

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus:9090
    isDefault: true
    version: 1
    editable: false
    uid: prometheus
    jsonData:
      httpMethod: POST
      timeInterval: 15s
